import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'com.google.devtools.ksp' version '2.3.4'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.10'
    id 'signing'
    id "com.vanniktech.maven.publish"
}

apply from: '../build.common.gradle'

def generatedResourcesDirProvider =
        layout.buildDirectory.dir("generated/resources/main")

tasks.register('writeBuildInfo') {
    outputs.dir(generatedResourcesDirProvider)

    inputs.property('version', version.toString())
    inputs.property('standardVersion', standardVersion.toString())

    doLast {
        String date = DateTimeFormatter
                .ofPattern("yyyy-M-d hh:mm:ss")
                .format(LocalDateTime.now())

        def outputDir = generatedResourcesDirProvider.get().asFile
        outputDir.mkdirs()

        def buildInfoFile =
                new File(outputDir, "PaperVisionBuildInfo.json")

        def json = """{
  "versionString": "$version",
  "standardVersionString": "$standardVersion",
  "buildDate": "$date",
  "isDev": ${version.toString().contains("dev")}
}"""

        if (!buildInfoFile.exists() ||
                buildInfoFile.text != json) {
            buildInfoFile.text = json
        }
    }
}

def generatedResourcesDir = files(
        generatedResourcesDirProvider
).builtBy(tasks.named("writeBuildInfo"))

sourceSets {
    main {
        resources {
            srcDir(generatedResourcesDir)
        }
    }
}

dependencies {
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinx_serialization_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinx_coroutines_version"

    compileOnly "io.github.spair:imgui-java-binding:$imgui_version"

    api 'org.deltacv:mai18n:1.2.0'

    implementation "org.java-websocket:Java-WebSocket:1.5.2"

    implementation "com.google.code.gson:gson:$gson_version"
    implementation "io.github.classgraph:classgraph:$classgraph_version"

    implementation "org.deltacv:mackjpeg:$mackjpeg_version"

    api project(":Shared")
    ksp project(":AnnotationProcessor")
}

ksp {
    arg("moduleName", "PaperVision")

    arg("paperNodeClassesMetadataPackage", "org.deltacv.visiongraph.node.generated")
    arg("paperNodeClassesMetadataClassName", "PaperNodeMetadata")

    arg("codecTypeClassesMetadataPackage", "org.deltacv.visiongraph.serialization.v2.generated")
    arg("codecTypeClassesMetadataClassName", "CodecTypeMetadata")
}